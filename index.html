<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سينما - موقع الأفلام</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 class="logo">🎬 سينما</h1>
  <input id="search" type="search" placeholder="ابحث عن فيلم...">
</header>

<section class="hero" id="hero"></section>

<nav class="filters" id="filters"></nav>

<main>
  <h2 id="sectionTitle">كل الأفلام</h2>
  <div class="grid" id="grid"></div>
  <p id="empty" class="empty" hidden>لا توجد نتائج.</p>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <button class="close" id="close" aria-label="إغلاق">✕</button>
    <div id="details"></div>
  </div>
</div>

<footer>© 2026 سينما — جميع الحقوق محفوظة</footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
